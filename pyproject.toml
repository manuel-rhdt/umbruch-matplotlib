[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helium-matplotlib"
version = "0.1.0"
description = "Matplotlib backend that renders PDF, text and math through helium"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
math = ["latex2mathml>=3.77"]

[tool.setuptools]
py-modules = ["helium_backend"]
