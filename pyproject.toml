[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umbruch-matplotlib"
version = "0.1.0"
description = "Matplotlib backend that renders PDF, text and math through umbruch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.8", "umbruch>=0.5.0"]

[project.optional-dependencies]
math = ["latex2mathml>=3.77"]

[tool.setuptools]
py-modules = ["umbruch_matplotlib"]
